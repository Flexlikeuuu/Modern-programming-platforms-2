name: hotel-booking

services:
  db:
    image: postgres:15-alpine
    container_name: hotel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: hotel_server
    ports:
      - "5001:5000"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: hotel_db
      PORT: 5000
    depends_on:
      - db
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build: ./client
    container_name: hotel_client
    ports:
      - "3000:3000"
    environment:
      VITE_API_TARGET: http://server:5000
    depends_on:
      - server

volumes:
  pgdata:
