name: hotel-booking

services:
  db:
    image: postgres:15-alpine
    container_name: hotel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: hotel_server
    ports:
      - "5001:5000"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: hotel_db
      PORT: 5000
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 1h
      SESSION_TTL_HOURS: 24
      MAX_SESSIONS: 3
      LOCK_AFTER_FAILS: 5
      LOCK_MINUTES: 15
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build: ./client
    container_name: hotel_client
    ports:
      - "3000:3000"
    environment:
      VITE_API_TARGET: http://server:5000
    depends_on:
      - server

volumes:
  pgdata:
