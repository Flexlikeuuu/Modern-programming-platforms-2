name: hotel-booking

services:
  db:
    image: postgres:15-alpine
    container_name: hotel_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-hotel_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hotel_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: hotel_server
    ports:
      - "5001:5000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build: ./client
    container_name: hotel_client
    ports:
      - "3000:3000"
    environment:
      VITE_API_TARGET: http://server:5000
    depends_on:
      - server

volumes:
  pgdata:
